<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administracao | Urna Eletronica</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/admin-login.css">
    <script defer src="../js/main.js"></script>
    <script defer src="../js/admin-login.js"></script>
  </head>
  <body data-pagina="admin-login">
    <main class="pagina-autenticacao">
      <section class="painel admin-login-painel" aria-labelledby="titulo-admin-login">
        <a class="voltar" href="../index.html">Voltar ao inicio</a>
        <p class="rotulo">Administracao</p>
        <h1 id="titulo-admin-login">Acesso restrito</h1>
        <form id="form-admin-login" class="formulario">
          <label for="usuario-admin">Usuario</label>
          <input id="usuario-admin" name="usuario" autocomplete="username" required>
          <label for="senha-admin">Senha</label>
          <input id="senha-admin" name="senha" type="password" autocomplete="current-password" required>
          <button class="botao" type="submit">Entrar</button>
        </form>
        <p id="admin-login-mensagem" class="mensagem" aria-live="polite"></p>
      </section>
    </main>
  </body>
</html>
