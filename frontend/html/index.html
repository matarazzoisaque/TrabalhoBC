<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrabalhoBC</title>
    <link rel="stylesheet" href="../css/main.css" />
    <script src="../js/main.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <p class="eyebrow">TrabalhoBC</p>
        <h1>Estrutura inicial conectada</h1>
        <p>
          Frontend em HTML, CSS e JavaScript integrado ao backend em Python.
        </p>
      </header>

      <section class="status-panel" aria-labelledby="status-title">
        <h2 id="status-title">Status do ambiente</h2>

        <div class="status-row">
          <span>Backend</span>
          <strong id="backend-status">Verificando...</strong>
        </div>

        <div class="status-row">
          <span>Banco de dados</span>
          <strong id="database-status">Conexao futura</strong>
        </div>

        <p class="status-message" id="status-message">
          Aguardando resposta do servidor Python.
        </p>
      </section>
    </main>
  </body>
</html>
