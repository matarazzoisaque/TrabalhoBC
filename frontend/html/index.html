<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrabalhoBC</title>
    <link rel="stylesheet" href="/css/main.css" />
    <script src="/js/main.js" defer></script>
  </head>
  <body>
    <main class="pagina">
      <header class="cabecalho">
        <h1>Urna dos Professores</h1>
        <p id="status-backend">Conectando ao backend...</p>
      </header>

      <section class="urna">
        <div class="visor">
          <h2>Professores cadastrados</h2>
          <div class="professores" id="lista-professores"></div>
        </div>

        <aside class="teclado" aria-label="Teclado numerico da urna">
          <h2>Numero do professor</h2>
          <div class="teclas">
            <button type="button">1</button>
            <button type="button">2</button>
            <button type="button">3</button>
            <button type="button">4</button>
            <button type="button">5</button>
            <button type="button">6</button>
            <button type="button">7</button>
            <button type="button">8</button>
            <button type="button">9</button>
            <button type="button">Corrige</button>
            <button type="button">0</button>
            <button type="button">Confirma</button>
          </div>
        </aside>
      </section>
    </main>
  </body>
</html>
