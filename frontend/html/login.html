<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Urna Eletronica</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/login.css">
    <script defer src="../js/main.js"></script>
    <script defer src="../js/login.js"></script>
  </head>
  <body data-pagina="login">
    <main class="pagina-autenticacao">
      <section class="painel login-painel" aria-labelledby="titulo-login">
        <a class="voltar" href="../index.html">Voltar ao inicio</a>
        <p class="rotulo">Eleitor</p>
        <h1 id="titulo-login">Acessar votacao</h1>
        <form id="form-login" class="formulario">
          <label for="ra">RA</label>
          <input id="ra" name="ra" autocomplete="username" required>
          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" autocomplete="current-password" required>
          <button class="botao" type="submit">Continuar</button>
        </form>
        <p id="login-mensagem" class="mensagem" aria-live="polite"></p>
      </section>
    </main>
  </body>
</html>
