<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca — Acervo</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="cabecalho">
        <h1>Biblioteca</h1>
        <nav class="menu">
            <a href="index.html" class="ativo">Acervo</a>
            <a href="cadastro.html">Cadastrar livro</a>
        </nav>
    </header>

    <main class="conteudo">
        <h2>Livros cadastrados</h2>

        <p id="mensagem" class="mensagem" role="status"></p>

        <table class="tabela" id="tabela-livros" hidden>
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Título</th>
                    <th>Autor</th>
                    <th>Ano</th>
                </tr>
            </thead>
            <tbody id="corpo-tabela"></tbody>
        </table>
    </main>

    <script src="assets/js/api.js" defer></script>
    <script src="assets/js/livros.js" defer></script>
</body>
</html>
