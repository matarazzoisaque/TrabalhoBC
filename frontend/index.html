<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>book-book</title>
  <link rel="stylesheet" href="assets/css/global.css" />
</head>
<body>
  <div id="app">
    <h1>book-book</h1>
    <p id="status-conexao">Verificando conexão com o backend...</p>
  </div>

  <script src="assets/js/api.js"></script>
  <script>
    verificarConexaoBackend().then((resposta) => {
      const elemento = document.getElementById("status-conexao");
      elemento.textContent = resposta.ok ? `✅ ${resposta.mensagem}` : `❌ ${resposta.mensagem}`;
    });
  </script>
</body>
</html>
