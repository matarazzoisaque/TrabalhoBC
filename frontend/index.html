<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Book</title>
    <script>
        (function() {
            const saved = localStorage.getItem('biblioteca-theme') || 'light';
            const theme = saved === 'dark' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="app">
        <header class="site-header">
            <a class="logo" href="index.html" aria-label="Book Book">
                <span class="logo-mark">Book Book</span>
            </a>

            <nav class="site-nav" aria-label="Navegação principal">
                <a class="nav-link active" href="index.html">Início</a>
                <a class="nav-link" href="cadastro.html">Livros</a>
                <a class="nav-link" href="leitores.html">Leitores</a>
                <a class="nav-link" href="exemplares.html">Exemplares</a>
                <a class="nav-link" href="emprestimos.html">Empréstimos</a>
            </nav>

            <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema">
                <span class="theme-icon" aria-hidden="true">☀</span>
            </button>
        </header>

        <main class="home">
            <section class="hero">
                <div class="hero-copy">
                    <span class="chapter-label">Book Book</span>
                    <h1>Conheça os títulos</h1>
                    <p class="hero-text">
                        Book Book, sua biblioteca online para descobrir, consultar e explorar um acervo de livros.
                    </p>

                    <div class="hero-actions">
                        <a class="cta-button" href="cadastro.html">
                            <span>Conferir títulos →</span>
                        </a>
                    </div>
                </div>

                <aside class="hero-visual" aria-label="Acervo visual">
                    <div class="book-display">
                        <img src="assets/images/bookbook .png" alt="Book Book" class="home-image">
                    </div>
                </aside>
            </section>
        </main>
    </div>

    <script src="assets/js/api.js" defer></script>
    <script src="assets/js/livros.js" defer></script>
</body>
</html>
