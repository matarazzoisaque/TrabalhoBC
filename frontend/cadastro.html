<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca — Cadastrar livro</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="cabecalho">
        <h1>Biblioteca</h1>
        <nav class="menu">
            <a href="index.html">Acervo</a>
            <a href="cadastro.html" class="ativo">Cadastrar livro</a>
        </nav>
    </header>

    <main class="conteudo">
        <h2>Cadastrar livro</h2>

        <p id="mensagem" class="mensagem" role="status"></p>

        <form id="formulario-livro" class="formulario" novalidate>
            <div class="campo">
                <label for="titulo">Título</label>
                <input type="text" id="titulo" name="titulo" maxlength="200" required>
            </div>

            <div class="campo">
                <label for="autor">Autor</label>
                <input type="text" id="autor" name="autor" maxlength="150" required>
            </div>

            <div class="campo">
                <label for="ano_publicacao">Ano de publicação</label>
                <input type="number" id="ano_publicacao" name="ano_publicacao"
                       min="1450" max="2100" required>
            </div>

            <button type="submit" class="botao">Salvar</button>
        </form>
    </main>

    <script src="assets/js/api.js" defer></script>
    <script src="assets/js/livros.js" defer></script>
</body>
</html>
