<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Book — Catálogo</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-theme="light">
    <div class="app">
        <header class="site-header">
            <a class="logo" href="index.html" aria-label="Book Book">
                <span class="logo-mark">Book Book</span>
            </a>

            <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema">
                <span class="theme-icon" aria-hidden="true">☀</span>
            </button>
        </header>

        <main class="catalog-wrap">
            <section class="catalog-head">
                <div class="catalog-title-block">
                    <span class="chapter-label">Acervo digital</span>
                    <h1>Biblioteca</h1>
                </div>

                <div class="catalog-actions">
                    <button class="primary-button open-form" id="openForm">
                        <span aria-hidden="true">+</span> Cadastrar novo livro
                    </button>
                </div>
            </section>

            <section class="catalog-toolbar">
                <div class="search-box">
                    <span class="search-icon" aria-hidden="true">⌕</span>
                    <input type="search" id="searchInput" placeholder="Buscar por título, autor ou gênero">
                </div>

                <div class="filter-row">
                    <label class="filter-label">
                        <span>Autor</span>
                        <select id="filterAutor">
                            <option value="">Todos</option>
                        </select>
                    </label>

                    <label class="filter-label">
                        <span>Gênero</span>
                        <select id="filterGenero">
                            <option value="">Todos</option>
                        </select>
                    </label>

                    <label class="filter-label">
                        <span>Ordenar</span>
                        <select id="sortSelect">
                            <option value="titulo-asc">Nome A–Z</option>
                            <option value="titulo-desc">Nome Z–A</option>
                            <option value="autor-asc">Autor A–Z</option>
                            <option value="autor-desc">Autor Z–A</option>
                            <option value="data-desc">Data de cadastro novo → antigo</option>
                            <option value="data-asc">Data de cadastro antigo → novo</option>
                            <option value="lancamento-desc">Ano de lançamento novo → antigo</option>
                            <option value="lancamento-asc">Ano de lançamento antigo → novo</option>
                        </select>
                    </label>
                </div>
            </section>

            <section class="catalog-list-wrapper">
                <div class="catalog-list" id="catalogList">
                </div>
            </section>

            <p id="mensagem" class="mensagem" role="status"></p>
        </main>
    </div>

    <div class="modal-backdrop" id="modalBackdrop">
        <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <button class="modal-close" id="closeModal" aria-label="Fechar">×</button>
            <div class="modal-head">
                <span class="chapter-label">Book Book</span>
                <h2 id="modalTitle">Cadastrar livro</h2>
                <p class="modal-subtitle">Preencha os dados abaixo para adicionar o livro ao acervo.</p>
            </div>

            <form id="formulario-livro" class="formulario" novalidate>
                <p id="mensagem-form" class="mensagem" role="alert"></p>

                <div class="two-columns">
                    <div class="campo">
                        <label for="titulo">Título <span class="obrigatorio" aria-hidden="true">*</span></label>
                        <input type="text" id="titulo" name="titulo" maxlength="200" required
                               placeholder="Título do livro">
                    </div>

                    <div class="campo">
                        <label for="autor">Autor <span class="obrigatorio" aria-hidden="true">*</span></label>
                        <input type="text" id="autor" name="autor" maxlength="150" required
                               placeholder="Nome do autor">
                    </div>
                </div>

                <div class="three-columns">
                    <div class="campo">
                        <label for="genero">Gênero <span class="obrigatorio" aria-hidden="true">*</span></label>
                        <input type="text" id="genero" name="genero" maxlength="80" required
                               placeholder="Ex.: Romance">
                    </div>

                    <div class="campo">
                        <label for="data_cadastro">Data de cadastro</label>
                        <input type="date" id="data_cadastro" name="data_cadastro" readonly tabindex="-1"
                               title="Definida automaticamente pelo sistema">
                    </div>

                    <div class="campo">
                        <label for="ano_lancamento">Ano de lançamento <span class="obrigatorio" aria-hidden="true">*</span></label>
                        <input type="number" id="ano_lancamento" name="ano_lancamento" min="1450" required
                               placeholder="Ex.: 1899">
                    </div>
                </div>

                <div class="campo">
                    <label for="resumo">Resumo <span class="obrigatorio" aria-hidden="true">*</span></label>
                    <textarea id="resumo" name="resumo" rows="6" maxlength="1000" required
                              aria-describedby="contador-resumo"
                              placeholder="Conte em poucas linhas do que o livro trata"></textarea>
                    <span class="campo-contador" id="contador-resumo">0/1000 caracteres</span>
                </div>

                <div class="form-actions">
                    <button type="submit" class="button button-primary">Criar</button>
                </div>
            </form>
        </section>
    </div>

    <div class="modal-backdrop" id="viewBackdrop">
        <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="viewTitulo">
            <button class="modal-close" id="closeView" aria-label="Fechar">×</button>
            <div class="modal-head">
                <span class="chapter-label" data-campo="genero"></span>
                <h2 id="viewTitulo" data-campo="titulo"></h2>
                <p class="modal-subtitle" data-campo="autor"></p>
            </div>

            <dl class="view-grid">
                <div>
                    <dt>Ano de lançamento</dt>
                    <dd data-campo="ano_lancamento"></dd>
                </div>
                <div>
                    <dt>Data de cadastro</dt>
                    <dd data-campo="data_cadastro"></dd>
                </div>
                <div>
                    <dt>Código</dt>
                    <dd data-campo="id_livro"></dd>
                </div>
            </dl>

            <div class="view-resumo">
                <h3>Resumo</h3>
                <p data-campo="resumo"></p>
            </div>
        </section>
    </div>

    <script src="assets/js/api.js" defer></script>
    <script src="assets/js/livros.js" defer></script>
</body>
</html>
