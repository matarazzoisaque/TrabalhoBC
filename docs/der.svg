<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1020" viewBox="0 0 1520 1020" role="img" aria-labelledby="title description">
  <title id="title">Diagrama entidade-relacionamento do sistema Book Book</title>
  <desc id="description">Quatro tabelas: livros, leitores, exemplares e emprestimos. Exemplares pertencem a livros; emprestimos pertencem a leitores e exemplares.</desc>
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #182238; }
      .subtitle { font: 16px Arial, sans-serif; fill: #58677d; }
      .table { fill: #ffffff; stroke: #9aabc1; stroke-width: 2; }
      .head-book { fill: #2d5f91; }
      .head-reader { fill: #27766a; }
      .head-copy { fill: #9a5a27; }
      .head-loan { fill: #735296; }
      .head { font: 700 18px Arial, sans-serif; fill: #ffffff; }
      .field { font: 15px Arial, sans-serif; fill: #273449; }
      .type { font: 14px Arial, sans-serif; fill: #65748a; }
      .key { font: 700 13px Arial, sans-serif; fill: #215c9c; }
      .fk { font: 700 13px Arial, sans-serif; fill: #9a5a27; }
      .line { stroke: #52667f; stroke-width: 2.4; fill: none; }
      .card { font: 700 16px Arial, sans-serif; fill: #32435b; }
      .note { font: 14px Arial, sans-serif; fill: #58677d; }
      .legend { font: 13px Arial, sans-serif; fill: #58677d; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#52667f" />
    </marker>
  </defs>

  <rect width="1520" height="860" fill="#f7f9fc" />
  <text x="60" y="58" class="title">DER - Sistema de Biblioteca</text>
  <text x="60" y="86" class="subtitle">Banco: biblioteca | MySQL 8+ | Estrutura definida em database/ddl.sql</text>
  <line x1="60" y1="108" x2="1460" y2="108" stroke="#d6dee9" stroke-width="2" />

  <!-- livros -->
  <rect x="70" y="170" width="370" height="278" rx="6" class="table" />
  <rect x="70" y="170" width="370" height="48" rx="6" class="head-book" />
  <rect x="70" y="212" width="370" height="6" fill="#2d5f91" />
  <text x="94" y="201" class="head">LIVROS</text>
  <text x="94" y="246" class="key">PK</text><text x="136" y="246" class="field">id_livro</text><text x="294" y="246" class="type">INT AUTO_INCREMENT</text>
  <line x1="88" y1="260" x2="422" y2="260" stroke="#e2e8f0" />
  <text x="136" y="287" class="field">titulo</text><text x="294" y="287" class="type">VARCHAR(200)</text>
  <line x1="88" y1="301" x2="422" y2="301" stroke="#e2e8f0" />
  <text x="136" y="328" class="field">autor</text><text x="294" y="328" class="type">VARCHAR(150)</text>
  <line x1="88" y1="342" x2="422" y2="342" stroke="#e2e8f0" />
  <text x="136" y="369" class="field">genero</text><text x="294" y="369" class="type">VARCHAR(80)</text>
  <line x1="88" y1="383" x2="422" y2="383" stroke="#e2e8f0" />
  <text x="136" y="410" class="field">ano_lancamento</text><text x="294" y="410" class="type">SMALLINT</text>
  <text x="94" y="434" class="note">UNIQUE (titulo, autor)</text>

  <!-- leitores -->
  <rect x="70" y="550" width="370" height="220" rx="6" class="table" />
  <rect x="70" y="550" width="370" height="48" rx="6" class="head-reader" />
  <rect x="70" y="592" width="370" height="6" fill="#27766a" />
  <text x="94" y="581" class="head">LEITORES</text>
  <text x="94" y="626" class="key">PK</text><text x="136" y="626" class="field">id_leitor</text><text x="294" y="626" class="type">INT AUTO_INCREMENT</text>
  <line x1="88" y1="640" x2="422" y2="640" stroke="#e2e8f0" />
  <text x="136" y="667" class="field">nome</text><text x="294" y="667" class="type">VARCHAR(150)</text>
  <line x1="88" y1="681" x2="422" y2="681" stroke="#e2e8f0" />
  <text x="136" y="708" class="field">email</text><text x="294" y="708" class="type">VARCHAR(150)</text>
  <line x1="88" y1="722" x2="422" y2="722" stroke="#e2e8f0" />
  <text x="136" y="749" class="field">telefone</text><text x="294" y="749" class="type">VARCHAR(20), NULL</text>

  <!-- exemplares -->
  <rect x="575" y="250" width="370" height="218" rx="6" class="table" />
  <rect x="575" y="250" width="370" height="48" rx="6" class="head-copy" />
  <rect x="575" y="292" width="370" height="6" fill="#9a5a27" />
  <text x="599" y="281" class="head">EXEMPLARES</text>
  <text x="599" y="326" class="key">PK</text><text x="641" y="326" class="field">id_exemplar</text><text x="799" y="326" class="type">INT AUTO_INCREMENT</text>
  <line x1="593" y1="340" x2="927" y2="340" stroke="#e2e8f0" />
  <text x="599" y="367" class="fk">FK</text><text x="641" y="367" class="field">id_livro</text><text x="799" y="367" class="type">INT NOT NULL</text>
  <line x1="593" y1="381" x2="927" y2="381" stroke="#e2e8f0" />
  <text x="641" y="408" class="field">status</text><text x="799" y="408" class="type">ENUM</text>
  <text x="599" y="443" class="note">DISPONIVEL ou EMPRESTADO</text>

  <!-- emprestimos -->
  <rect x="1080" y="278" width="370" height="258" rx="6" class="table" />
  <rect x="1080" y="278" width="370" height="48" rx="6" class="head-loan" />
  <rect x="1080" y="320" width="370" height="6" fill="#735296" />
  <text x="1104" y="309" class="head">EMPRESTIMOS</text>
  <text x="1104" y="354" class="key">PK</text><text x="1146" y="354" class="field">id_emprestimo</text><text x="1304" y="354" class="type">INT AUTO_INCREMENT</text>
  <line x1="1098" y1="368" x2="1432" y2="368" stroke="#e2e8f0" />
  <text x="1104" y="395" class="fk">FK</text><text x="1146" y="395" class="field">id_leitor</text><text x="1304" y="395" class="type">INT NOT NULL</text>
  <line x1="1098" y1="409" x2="1432" y2="409" stroke="#e2e8f0" />
  <text x="1104" y="436" class="fk">FK</text><text x="1146" y="436" class="field">id_exemplar</text><text x="1304" y="436" class="type">INT NOT NULL</text>
  <line x1="1098" y1="450" x2="1432" y2="450" stroke="#e2e8f0" />
  <text x="1146" y="477" class="field">data_emprestimo</text><text x="1304" y="477" class="type">DATE</text>
  <line x1="1098" y1="491" x2="1432" y2="491" stroke="#e2e8f0" />
  <text x="1146" y="518" class="field">data_devolucao</text><text x="1304" y="518" class="type">DATE, NULL</text>

  <!-- relationships: arrows point to the parent table -->
  <path d="M575 365 H505 V309 H440" class="line" marker-end="url(#arrow)" />
  <text x="455" y="296" class="card">1</text><text x="548" y="354" class="card">N</text>
  <text x="455" y="336" class="note">possui</text>

  <path d="M1080 394 H1015 V680 H440" class="line" marker-end="url(#arrow)" />
  <text x="455" y="666" class="card">1</text><text x="1040" y="381" class="card">N</text>
  <text x="730" y="670" class="note">realiza</text>

  <path d="M1080 435 H1015 V468 H945" class="line" marker-end="url(#arrow)" />
  <text x="960" y="455" class="card">1</text><text x="1040" y="458" class="card">N</text>
  <text x="960" y="492" class="note">registra</text>

  <rect x="575" y="820" width="875" height="132" rx="6" fill="#edf3fa" stroke="#c5d4e5" stroke-width="1.5" />
  <text x="603" y="854" class="field" font-weight="700">Leitura do relacionamento</text>
  <text x="603" y="883" class="note">Um LIVRO possui N EXEMPLARES. Um LEITOR realiza N EMPRESTIMOS.</text>
  <text x="603" y="910" class="note">Um EXEMPLAR pode ter N EMPRESTIMOS no historico; um emprestimo aponta para um unico leitor e um unico exemplar.</text>
  <text x="603" y="937" class="note">As chaves estrangeiras usam ON UPDATE CASCADE e ON DELETE RESTRICT.</text>

  <line x1="60" y1="975" x2="1460" y2="975" stroke="#d6dee9" stroke-width="2" />
  <text x="60" y="1002" class="legend">PK = chave primaria | FK = chave estrangeira | N = muitos | 1 = um</text>
</svg>
